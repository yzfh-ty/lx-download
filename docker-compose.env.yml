services:
  lx-download-server:
    image: ghcr.io/yzfh-ty/lx-download:${LX_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${CONTAINER_NAME:-lx-download-server}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9527}:${PORT:-9527}"
    volumes:
      - "${DATA_DIR:-./data}:/server/data"
      - "${CACHE_DIR:-./cache}:/server/cache"
      - "${DOWNLOAD_DIR:-./download}:/server/download"
      - "${LOG_DIR:-./logs}:/server/logs"
    environment:
      NODE_ENV: production
      PORT: "${PORT:-9527}"
      BIND_IP: "${BIND_IP:-0.0.0.0}"
      DATA_PATH: /server/data
      LOG_PATH: /server/logs
      WEBPLAYER_TOKEN: "${WEBPLAYER_TOKEN:?Set WEBPLAYER_TOKEN in .env or the shell environment}"
      PLAYER_PATH: "${PLAYER_PATH:-/}"
      ENABLE_CACHE_SIZE_LIMIT: "${ENABLE_CACHE_SIZE_LIMIT:-false}"
      CACHE_SIZE_LIMIT: "${CACHE_SIZE_LIMIT:-2000}"
      PROXY_HEADER: "${PROXY_HEADER:-x-real-ip}"
      PROXY_ALL_ENABLED: "${PROXY_ALL_ENABLED:-false}"
      PROXY_ALL_ADDRESS: "${PROXY_ALL_ADDRESS:-}"
      SINGER_SOURCE_PRIORITY: "${SINGER_SOURCE_PRIORITY:-tx,wy}"
